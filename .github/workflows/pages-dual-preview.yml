name: Deploy Admin, Platform Admin And Patient Previews To GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Admin Dependencies
        working-directory: react-app
        run: npm ci

      - name: Install Platform Admin Dependencies
        working-directory: platform-admin
        run: npm ci

      - name: Install Patient Preview Dependencies
        working-directory: patient-web-preview
        run: npm ci

      - name: Install Patient H5 Dependencies
        working-directory: patient-mobile-h5
        run: npm ci

      - name: Build Admin Pages Bundle
        working-directory: react-app
        run: npm run build:pages:admin

      - name: Build Platform Admin Pages Bundle
        working-directory: platform-admin
        run: npm run build:pages:platform-admin

      - name: Build Patient H5 Pages Bundle
        working-directory: patient-mobile-h5
        run: npm run build:pages:patient-h5

      - name: Build Patient Pages Bundle
        working-directory: patient-web-preview
        env:
          VITE_PATIENT_PREVIEW_URL: /aihmp_b_demo/patient-h5/
        run: npm run build:pages:patient

      - name: Assemble Pages Artifact
        run: |
          mkdir -p pages-out/admin
          mkdir -p pages-out/platform-admin
          mkdir -p pages-out/patient
          mkdir -p pages-out/patient-h5
          cp -R react-app/dist/. pages-out/admin/
          cp -R platform-admin/dist/. pages-out/platform-admin/
          cp -R patient-mobile-h5/dist/. pages-out/patient-h5/
          cp -R patient-web-preview/dist/. pages-out/patient/
          cat > pages-out/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>健康管理平台演示入口</title>
              <style>
                * {
                  box-sizing: border-box;
                }

                body {
                  margin: 0;
                  min-height: 100vh;
                  background: #f3f5f8;
                  color: #111827;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
                }

                main {
                  width: min(960px, calc(100vw - 48px));
                  margin: 0 auto;
                  padding: 72px 0;
                }

                h1 {
                  margin: 0;
                  font-size: 28px;
                  line-height: 36px;
                }

                .subtitle {
                  margin: 10px 0 28px;
                  color: #6b7280;
                  font-size: 14px;
                  line-height: 22px;
                }

                .nav-grid {
                  display: grid;
                  grid-template-columns: repeat(3, minmax(0, 1fr));
                  gap: 16px;
                }

                .nav-card {
                  display: block;
                  min-height: 150px;
                  padding: 22px;
                  border: 1px solid #e5e7eb;
                  border-radius: 8px;
                  background: #fff;
                  color: inherit;
                  text-decoration: none;
                  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
                }

                .nav-card:hover {
                  border-color: #1677ff;
                }

                .tag {
                  display: inline-flex;
                  align-items: center;
                  height: 24px;
                  padding: 0 8px;
                  border-radius: 4px;
                  background: #e6f4ff;
                  color: #0958d9;
                  font-size: 12px;
                  font-weight: 600;
                }

                .name {
                  margin-top: 18px;
                  font-size: 18px;
                  font-weight: 700;
                  line-height: 26px;
                }

                .desc {
                  margin-top: 8px;
                  color: #6b7280;
                  font-size: 13px;
                  line-height: 20px;
                }

                @media (max-width: 760px) {
                  main {
                    width: min(100% - 32px, 520px);
                    padding: 40px 0;
                  }

                  .nav-grid {
                    grid-template-columns: 1fr;
                  }
                }
              </style>
            </head>
            <body>
              <main>
                <h1>健康管理平台演示入口</h1>
                <p class="subtitle">选择要访问的端侧应用。</p>
                <div class="nav-grid">
                  <a class="nav-card" href="./platform-admin/">
                    <span class="tag">M 端</span>
                    <div class="name">平台管理端</div>
                    <div class="desc">租户管理、租户服务配置等平台级管理能力。</div>
                  </a>
                  <a class="nav-card" href="./admin/">
                    <span class="tag">B 端</span>
                    <div class="name">业务管理端</div>
                    <div class="desc">医护工作台、患者管理和业务运营能力。</div>
                  </a>
                  <a class="nav-card" href="./patient/">
                    <span class="tag">C 端</span>
                    <div class="name">患者端</div>
                    <div class="desc">患者移动端预览入口。</div>
                  </a>
                </div>
              </main>
            </body>
          </html>
          EOF

      - name: Verify Pages Preview Artifact
        run: node scripts/verify-pages-preview.mjs

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
