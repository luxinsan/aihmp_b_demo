<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 原生方案编排 — 对话驱动原型</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black: #111;
  --white: #fff;
  --gray-50: #fafafa;
  --gray-100: #f4f4f4;
  --gray-200: #ececec;
  --gray-300: #d8d8d8;
  --gray-400: #bbb;
  --gray-500: #999;
  --gray-600: #666;
  --blue: #4A90D9;
  --green: #5B9A41;
  --orange: #E0963C;
  --red: #D9453C;
  --font: "SF Pro Display", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  --radius: 8px;
}

body {
  font-family: var(--font);
  font-size: 14px;
  background: var(--gray-100);
  height: 100vh;
  overflow: hidden;
  color: var(--black);
}

/* ===== Header ===== */
header {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--white);
  border-bottom: 1px solid var(--gray-300);
  font-size: 13px;
}
header strong { font-size: 14px; }
.header-right { display: flex; gap: 8px; align-items: center; }
.header-right .status {
  font-size: 12px;
  color: var(--gray-500);
  display: flex;
  align-items: center;
  gap: 6px;
}
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}

/* ===== Shell ===== */
.shell {
  display: grid;
  grid-template-columns: 200px 1fr;
  height: calc(100vh - 48px);
}

/* ===== Left Nav ===== */
nav {
  background: var(--white);
  border-right: 1px solid var(--gray-300);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.nav-header {
  padding: 12px 14px;
  font-weight: 700;
  font-size: 12px;
  color: var(--gray-500);
  text-transform: uppercase;
  letter-spacing: .5px;
  border-bottom: 1px solid var(--gray-200);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  font-size: 13px;
  cursor: pointer;
  transition: background .12s;
}
.nav-item:hover { background: var(--gray-50); }
.nav-item.active { background: var(--black); color: var(--white); }
.nav-item .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  flex-shrink: 0;
}
.nav-item .dot.done { background: currentColor; }
.nav-item .dot.warn { border-color: var(--orange); background: var(--orange); }

/* ===== Main Area ===== */
main {
  display: grid;
  grid-template-rows: 1fr auto;
  overflow: hidden;
}

/* ===== Conversation Panel ===== */
.conv-panel {
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  background: var(--white);
  border-bottom: 1px solid var(--gray-200);
  max-height: 100%;
}

.msg {
  display: flex;
  gap: 10px;
  max-width: 720px;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg.user { align-self: flex-end; flex-direction: row-reverse; }

.msg-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  align-self: flex-start;
}
.msg.ai .msg-avatar { background: var(--black); color: var(--white); font-size: 12px; }
.msg.user .msg-avatar { background: var(--gray-200); }

.msg-bubble {
  padding: 10px 14px;
  border-radius: var(--radius);
  line-height: 1.7;
  font-size: 14px;
}
.msg.ai .msg-bubble { background: var(--gray-50); border: 1px solid var(--gray-200); }
.msg.user .msg-bubble { background: var(--black); color: var(--white); }

.msg-bubble p { margin-bottom: 6px; }
.msg-bubble p:last-child { margin-bottom: 0; }
.msg-bubble .highlight { color: var(--blue); font-weight: 600; }

/* AI action buttons in bubble */
.msg-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.msg-actions button {
  padding: 5px 12px;
  border: 1px solid var(--gray-300);
  border-radius: 14px;
  background: var(--white);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: all .12s;
}
.msg-actions button:hover { border-color: var(--black); background: var(--gray-50); }
.msg-actions button.primary {
  background: var(--black);
  color: var(--white);
  border-color: var(--black);
}

/* ===== Input Bar ===== */
.input-bar {
  display: flex;
  gap: 8px;
  padding: 12px 24px;
  background: var(--white);
  border-top: 1px solid var(--gray-200);
  align-items: center;
}
.input-bar textarea {
  flex: 1;
  border: 1px solid var(--gray-300);
  border-radius: var(--radius);
  padding: 8px 12px;
  font: inherit;
  font-size: 13px;
  resize: none;
  min-height: 38px;
  max-height: 80px;
  outline: none;
  transition: border-color .15s;
}
.input-bar textarea:focus { border-color: var(--black); }
.input-bar button {
  padding: 8px 16px;
  border: none;
  border-radius: var(--radius);
  background: var(--black);
  color: var(--white);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
}
.input-bar button:hover { background: #333; }
.input-bar button:disabled { opacity: .4; cursor: not-allowed; }

/* ===== Preview Panel ===== */
.preview-panel {
  background: var(--gray-50);
  border-top: 1px solid var(--gray-300);
  max-height: 50vh;
  overflow-y: auto;
}
.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 24px;
  border-bottom: 1px solid var(--gray-200);
  background: var(--white);
  position: sticky;
  top: 0;
  z-index: 2;
}
.preview-header strong { font-size: 13px; }
.preview-header .actions { display: flex; gap: 6px; align-items: center; }
.preview-header .actions button {
  font-size: 11px;
  padding: 3px 8px;
  border: 1px solid var(--gray-300);
  border-radius: 4px;
  background: var(--white);
  cursor: pointer;
}
.preview-header .actions button:hover { background: var(--gray-50); }
.preview-header .actions button.active { background: var(--black); color: var(--white); border-color: var(--black); }

/* Sparkline overview bar */
.overview-bar {
  padding: 10px 24px;
  background: var(--white);
  border-bottom: 1px solid var(--gray-200);
  display: flex;
  align-items: center;
  gap: 10px;
}
.overview-label {
  font-size: 11px;
  color: var(--gray-500);
  flex-shrink: 0;
  white-space: nowrap;
}
.overview-track {
  flex: 1;
  height: 32px;
  background: var(--gray-100);
  border-radius: 4px;
  position: relative;
  overflow: hidden;
}
.overview-week {
  position: absolute;
  top: 0; bottom: 0;
  border-right: 1px solid rgba(255,255,255,.6);
}
.overview-week.filled { background: var(--black); opacity: .15; }
.overview-week.dense { background: var(--black); opacity: .35; }
.overview-marker {
  position: absolute;
  top: 4px;
  width: 8px; height: 8px;
  background: var(--red);
  border-radius: 2px;
  transform: translateX(-50%) rotate(45deg);
}
.overview-alert {
  position: absolute;
  bottom: 2px;
  width: 100%;
  height: 2px;
  border-top: 2px dashed var(--orange);
  opacity: .5;
}

/* Node list */
.node-list {
  padding: 8px 24px;
}
.node-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: background .1s;
  font-size: 13px;
}
.node-row:hover { background: var(--white); }
.node-row .n-order {
  width: 22px;
  font-size: 11px;
  color: var(--gray-500);
  flex-shrink: 0;
}
.node-row .n-name {
  font-weight: 600;
  width: 130px;
  flex-shrink: 0;
}
.node-row .n-meta {
  display: flex;
  gap: 4px;
  flex: 1;
  flex-wrap: wrap;
}
.node-row .n-tag {
  font-size: 11px;
  padding: 1px 6px;
  border: 1px solid var(--gray-300);
  border-radius: 4px;
  color: var(--gray-600);
  white-space: nowrap;
}
.node-row .n-time {
  font-size: 12px;
  color: var(--gray-500);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
}
.n-time-bar {
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--gray-300);
  flex-shrink: 0;
}
.n-time-bar.span { width: 60px; background: var(--black); opacity: .3; }
.n-time-bar.single { width: 8px; background: var(--gray-600); border-radius: 50%; }
.node-row .n-status {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  flex-shrink: 0;
}
.n-status.generated { background: #e8f0fe; color: var(--blue); }
.n-status.confirmed { background: #e6f4ea; color: var(--green); }
.n-status.pending { background: #fef7e0; color: var(--orange); }
.n-status.new { background: #e8f0fe; color: var(--blue); animation: highlightNew .6s ease 3; }
@keyframes highlightNew {
  0%, 100% { background: #e8f0fe; }
  50% { background: #bbdefb; }
}

.alert-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  font-size: 12px;
  color: var(--gray-600);
}
.alert-row .a-icon { flex-shrink: 0; }

.empty-preview {
  padding: 32px;
  text-align: center;
  color: var(--gray-500);
  font-size: 13px;
}

/* Shadow annotations */
.node-row .n-shadow {
  display: none;
  font-size: 10px;
  color: var(--gray-500);
}
.show-shadow .node-row .n-shadow { display: block; }
</style>
</head>
<body>

<header>
  <strong>AI 原生健康管理方案编排</strong>
  <div class="header-right">
    <span class="status"><span class="status-dot"></span> 结构化同步中</span>
    <span style="color:var(--gray-400);">|</span>
    <span style="font-size:12px;color:var(--gray-500);">2 型糖尿病超重人群 · 90 天</span>
  </div>
</header>

<div class="shell">
  <!-- ===== Left Nav ===== -->
  <nav>
    <div class="nav-header">方案结构</div>
    <div class="nav-item"><span class="dot done"></span> 基础信息</div>
    <div class="nav-item"><span class="dot done"></span> 管理主题</div>
    <div class="nav-item"><span class="dot done"></span> 适用对象</div>
    <div class="nav-item"><span class="dot done"></span> 管理目标</div>
    <div class="nav-item"><span class="dot done"></span> 监测数据</div>
    <div class="nav-item active"><span class="dot done"></span> 管理路径节点</div>
    <div class="nav-item"><span class="dot done"></span> 预警规则</div>
    <div class="nav-item"><span class="dot"></span> 评估与调整</div>
  </nav>

  <!-- ===== Main: Conversation + Preview ===== -->
  <main>
    <div class="conv-panel" id="conversation">
      <!-- Initial AI greeting -->
      <div class="msg ai">
        <div class="msg-avatar">AI</div>
        <div class="msg-bubble">
          <p>你好，我是方案编排助手。告诉我你想为哪类人群设计什么样的管理方案，我会生成结构化草案，你可以随时通过对话调整。</p>
        </div>
      </div>
    </div>

    <div class="input-bar">
      <textarea id="userInput" placeholder="描述你的管理意图…&#10;例如：为 2 型糖尿病超重患者设计 90 天方案，重点营养和运动" rows="1"></textarea>
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>

    <div class="preview-panel" id="previewPanel">
      <div class="preview-header">
        <strong>方案预览 — 实时同步</strong>
        <div class="actions">
          <button id="shadowToggle" onclick="toggleShadow()">结构影子层</button>
          <span style="font-size:11px;color:var(--gray-500);">
            <span id="nodeCount">0</span> 个节点 · <span id="alertCount">0</span> 条预警
          </span>
        </div>
      </div>
      <div id="previewContent">
        <div class="empty-preview">等待 AI 生成方案草案…</div>
      </div>
    </div>
  </main>
</div>

<script>
// ============================================================
// State
// ============================================================
let nodes = [];
let alerts = [];
let turn = 0;

// ============================================================
// Conversation
// ============================================================
const conversation = document.getElementById('conversation');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function addMessage(role, html, actions) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = role === 'user' ? '👤' : 'AI';
  let actionHTML = '';
  if (actions && actions.length) {
    actionHTML = '<div class="msg-actions">' +
      actions.map(a => `<button class="${a.primary ? 'primary' : ''}" onclick="${a.onclick}">${a.label}</button>`).join('') +
      '</div>';
  }
  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div class="msg-bubble">${html}${actionHTML}</div>
  `;
  conversation.appendChild(div);
  conversation.scrollTop = conversation.scrollHeight;
}

function addUserMessage(text) {
  addMessage('user', `<p>${text}</p>`);
}

function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;
  addUserMessage(text);
  userInput.value = '';
  sendBtn.disabled = true;
  userInput.disabled = true;

  // Simulate AI thinking delay
  setTimeout(() => {
    handleTurn(text);
    sendBtn.disabled = false;
    userInput.disabled = false;
    userInput.focus();
  }, 800 + Math.random() * 600);
}

// ============================================================
// AI Response Logic
// ============================================================
function handleTurn(text) {
  turn++;

  if (turn === 1) {
    // First message: generate initial plan
    nodes = [
      { id:'n1', name:'基线问卷', type:'问卷', dir:'基线评估', time:'第1天', span:'single', status:'generated' },
      { id:'n2', name:'每日饮食记录', type:'打卡', dir:'营养', time:'第1–90天', span:'span', repeat:'每日1次 ×90', status:'generated' },
      { id:'n3', name:'运动执行记录', type:'打卡', dir:'运动', time:'第1–90天', span:'span', repeat:'每周3次 ×39', status:'generated' },
      { id:'n4', name:'阶段评估', type:'评估', dir:'评估', time:'第28天', span:'single', status:'generated' },
      { id:'n5', name:'终期评估', type:'评估', dir:'评估', time:'第90天', span:'single', status:'generated' },
    ];
    alerts = [
      { id:'a1', name:'血糖超阈值', action:'触发医护审核 → 复测建议', icon:'🩸' },
      { id:'a2', name:'连续3天未打卡', action:'提醒患者 → 通知健康管理师', icon:'🔔' },
    ];
    renderPreview();

    addMessage('ai', `
      <p>好的，我先梳理一下<span class="highlight">2 型糖尿病超重人群 90 天管理方案</span>的结构——</p>
      <p><strong>第 1 天：</strong>完成基线问卷，了解患者当前饮食、运动和血糖情况。<br>
      <strong>第 1–90 天：</strong>每日饮食记录 + 每周 3 次运动记录，建立核心习惯。<br>
      <strong>第 28 天：</strong>第一次阶段评估，检查目标达成和依从性。<br>
      <strong>第 90 天：</strong>终期评估，判断结营、续管或转诊。</p>
      <p>全程监控空腹血糖和打卡依从性，异常时自动触发医护跟进。下方预览已同步更新——你看看整体结构是否符合预期？</p>
    `, [
      { label: '确认结构，继续调整', primary: true, onclick: 'confirmStructure()' },
    ]);

  } else if (text.includes('饮食') && (text.includes('每天') || text.includes('每日') || text.includes('1 次'))) {
    // Adjust diet node
    const n = nodes.find(x => x.id === 'n2');
    if (n) {
      n.name = '每日饮食总结';
      n.repeat = '每日1次 ×90';
      n.status = 'confirmed';
    }
    renderPreview();
    addMessage('ai', `
      <p>已调整：饮食记录改为<strong>每日 1 次总结</strong>，降低患者执行负担。预览已更新。</p>
      <p>另外我注意到——当前方案缺少第 14 天左右的早期随访。通常在第二周做一次随访可以及时发现问题。需要我加上吗？</p>
    `, [
      { label: '加第 14 天随访', primary: true, onclick: 'addFollowUp14()' },
      { label: '暂不加', onclick: 'skipFollowUp()' },
    ]);

  } else if (text.includes('随访') || text.includes('第 14 天')) {
    // Add follow-up node
    nodes.push({ id:'n6', name:'阶段随访', type:'随访', dir:'复查', time:'第14天', span:'single', status:'new' });
    nodes.sort((a, b) => parseInt(a.time.match(/\d+/)?.[0] || 0) - parseInt(b.time.match(/\d+/)?.[0] || 0));
    renderPreview();
    addMessage('ai', `
      <p>已在第 14 天新增<span class="highlight">阶段随访</span>节点，健康管理师执行。现在方案共 ${nodes.length} 个节点，时间覆盖更合理。</p>
      <p>还有一个建议：90 天周期结束时，是否需要增加<span class="highlight">HbA1c 糖化血红蛋白复查</span>作为终期评估的客观依据？</p>
    `, [
      { label: '加 HbA1c 复查', primary: true, onclick: 'addHbA1c()' },
      { label: '不需要', onclick: 'skipHbA1c()' },
    ]);

  } else if (text.includes('HbA1c') || text.includes('复查') || text.includes('糖化')) {
    nodes.push({ id:'n7', name:'HbA1c 复查', type:'复查', dir:'慢病管理', time:'第85天', span:'single', status:'new' });
    nodes.sort((a, b) => parseInt(a.time.match(/\d+/)?.[0] || 0) - parseInt(b.time.match(/\d+/)?.[0] || 0));
    renderPreview();
    addMessage('ai', `
      <p>已在终期评估前新增<span class="highlight">HbA1c 复查</span>节点（第 85 天），为第 90 天终期评估提供客观生化指标。方案现在共 ${nodes.length} 个节点。</p>
      <p>当前方案结构已比较完整。你还可以继续调整任何节点的属性、时间或内容。调整完后，可以随时让我做发布前结构校验。</p>
    `);

  } else {
    addMessage('ai', `
      <p>收到。我会根据你的描述调整方案结构。你可以具体说说想改哪个节点——比如调整执行频率、修改时间、增加或删除节点。</p>
    `);
  }
}

// ============================================================
// Quick action handlers
// ============================================================
function confirmStructure() {
  addUserMessage('确认结构，继续调整');
  setTimeout(() => {
    addMessage('ai', `
      <p>好的。你可以继续用自然语言调整任何内容。试试说「饮食记录改成每天 1 次」「第 14 天加一次随访」。</p>
    `);
  }, 500);
}

function addFollowUp14() {
  addUserMessage('加第 14 天随访');
  setTimeout(() => {
    nodes.push({ id:'n6', name:'阶段随访', type:'随访', dir:'复查', time:'第14天', span:'single', status:'new' });
    nodes.sort((a, b) => parseInt(a.time.match(/\d+/)?.[0] || 0) - parseInt(b.time.match(/\d+/)?.[0] || 0));
    renderPreview();
    addMessage('ai', `
      <p>已在第 14 天新增<span class="highlight">阶段随访</span>节点。还有一个建议：90 天周期结束时，是否需要增加<span class="highlight">HbA1c 糖化血红蛋白复查</span>作为终期评估的客观依据？</p>
    `, [
      { label: '加 HbA1c 复查', primary: true, onclick: 'addHbA1c()' },
      { label: '不需要', onclick: 'skipHbA1c()' },
    ]);
  }, 600);
}

function skipFollowUp() {
  addUserMessage('暂不加');
  setTimeout(() => {
    addMessage('ai', `
      <p>好的，先不加。那另一个建议：90 天周期结束时，是否需要增加<span class="highlight">HbA1c 糖化血红蛋白复查</span>作为终期评估的客观依据？</p>
    `, [
      { label: '加 HbA1c 复查', primary: true, onclick: 'addHbA1c()' },
      { label: '不需要', onclick: 'skipHbA1c()' },
    ]);
  }, 500);
}

function addHbA1c() {
  addUserMessage('加 HbA1c 复查');
  setTimeout(() => {
    nodes.push({ id:'n7', name:'HbA1c 复查', type:'复查', dir:'慢病管理', time:'第85天', span:'single', status:'new' });
    nodes.sort((a, b) => parseInt(a.time.match(/\d+/)?.[0] || 0) - parseInt(b.time.match(/\d+/)?.[0] || 0));
    renderPreview();
    addMessage('ai', `
      <p>已在终期评估前新增<span class="highlight">HbA1c 复查</span>节点（第 85 天），为终期评估提供客观依据。方案现在共 ${nodes.length} 个节点，结构已比较完整。</p>
      <p>你可以继续调整，或随时让我做发布前结构校验。</p>
    `);
  }, 600);
}

function skipHbA1c() {
  addUserMessage('不需要');
  setTimeout(() => {
    addMessage('ai', `
      <p>好的。当前方案共 ${nodes.length} 个节点、${alerts.length} 条预警规则，结构基本完整。你可以继续调整，或随时让我做发布前校验。</p>
    `);
  }, 500);
}

// ============================================================
// Preview Rendering
// ============================================================
function renderPreview() {
  const container = document.getElementById('previewContent');
  document.getElementById('nodeCount').textContent = nodes.length;
  document.getElementById('alertCount').textContent = alerts.length;

  if (nodes.length === 0) {
    container.innerHTML = '<div class="empty-preview">等待 AI 生成方案草案…</div>';
    return;
  }

  // Overview bar
  const days = 90;
  const weeks = Math.ceil(days / 7);
  let overviewWeeks = '';
  const milestoneDays = nodes.filter(n => n.type === '评估' || n.type === '随访').map(n => parseInt(n.time.match(/\d+/)?.[0] || 0));
  const spanNodes = nodes.filter(n => n.span === 'span');

  for (let w = 0; w < weeks; w++) {
    const wStart = w * 7;
    const wEnd = wStart + 7;
    let cls = '';
    const coveredBySpan = spanNodes.some(n => {
      const s = parseInt(n.time.match(/第(\d+)/)?.[1] || 0);
      const e = n.time.match(/第\d+–(\d+)/) ? parseInt(n.time.match(/第\d+–(\d+)/)?.[1] || 0) : s;
      return wStart < e && wEnd > s;
    });
    const hasMilestone = milestoneDays.some(d => d >= wStart && d < wEnd);
    if (hasMilestone) cls = 'dense';
    else if (coveredBySpan) cls = 'filled';
    overviewWeeks += `<div class="overview-week ${cls}" style="left:${(w / weeks) * 100}%;width:${(1 / weeks) * 100}%;"></div>`;
  }

  // Milestone markers
  let overviewMarkers = '';
  milestoneDays.forEach(d => {
    const pct = (d / days) * 100;
    overviewMarkers += `<div class="overview-marker" style="left:${pct}%;" title="第${d}天"></div>`;
  });

  // Node rows
  let nodeRows = '';
  nodes.forEach((n, i) => {
    nodeRows += `
    <div class="node-row" id="node-${n.id}">
      <span class="n-order">#${i + 1}</span>
      <span class="n-name">${n.name}</span>
      <span class="n-meta">
        <span class="n-tag">${n.type}</span>
        <span class="n-tag">${n.dir}</span>
        ${n.repeat ? `<span class="n-tag">${n.repeat}</span>` : ''}
      </span>
      <span class="n-time">
        <span class="n-time-bar ${n.span}"></span>
        ${n.time}
      </span>
      <span class="n-status ${n.status}">${statusLabel(n.status)}</span>
    </div>`;
  });

  // Alert rows
  let alertRows = '';
  alerts.forEach(a => {
    alertRows += `
    <div class="alert-row">
      <span class="a-icon">${a.icon}</span>
      <span><strong>${a.name}</strong></span>
      <span>→ ${a.action}</span>
    </div>`;
  });

  container.innerHTML = `
    <div class="overview-bar">
      <span class="overview-label">90 天概览</span>
      <div class="overview-track">
        ${overviewWeeks}
        ${overviewMarkers}
        <div class="overview-alert"></div>
      </div>
      <span style="font-size:10px;color:var(--gray-500);flex-shrink:0;">◆ 评估  ▓ 持续  ⚡ 预警</span>
    </div>
    <div class="node-list">
      ${nodeRows}
      <div style="border-top:1px solid var(--gray-200);margin:8px 0;"></div>
      ${alertRows}
    </div>
  `;

  // Highlight new nodes briefly
  document.querySelectorAll('.n-status.new').forEach(el => {
    setTimeout(() => el.classList.remove('new'), 3000);
  });
}

function statusLabel(s) {
  const map = { generated: 'AI 生成', confirmed: '已确认', pending: '待确认', new: '新增', milestone: '里程碑' };
  return map[s] || s;
}

// ============================================================
// Shadow Layer Toggle
// ============================================================
function toggleShadow() {
  const panel = document.getElementById('previewPanel');
  panel.classList.toggle('show-shadow');
  const btn = document.getElementById('shadowToggle');
  btn.classList.toggle('active');
  if (panel.classList.contains('show-shadow')) {
    btn.textContent = '结构影子层：开';
  } else {
    btn.textContent = '结构影子层';
  }
  // Re-render to show/hide shadows
  renderPreview();
}

// ============================================================
// Init
// ============================================================
userInput.focus();
</script>
